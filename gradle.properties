# litertlm-jvm 0.17.0-alpha1 exige JDK 21 em runtime. O Gradle detecta
# automaticamente JDKs instalados pelo SDKMAN em ~/.sdkman/candidates/java/.
# Se o seu JDK 21 estiver em outro lugar, ajuste o caminho abaixo.
org.gradle.java.installations.auto-download=false
org.gradle.java.installations.paths=/home/guest/.sdkman/candidates/java/21.0.5-tem
